<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Dynamic Theme Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="facetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Backing for Crisp Contrast in Light/Dark Browser Tabs -->
  <rect width="100" height="100" rx="22" fill="#0A1128" />

  <!-- Outer Cyber Hex Shield -->
  <path d="M50 8 L88 28 L88 72 L50 92 L12 72 L12 28 Z" 
        fill="url(#facetGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#shieldGlow)" />

  <!-- Inner Architectural 'M' Facets (Modern Systems) -->
  <!-- Left Pillar of M -->
  <path d="M22 34 L38 43 L38 72 L22 63 Z" 
        fill="url(#coreGrad)" 
        opacity="0.95" />
  
  <!-- Right Pillar of M -->
  <path d="M78 34 L62 43 L62 72 L78 63 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.95" />

  <!-- Upper Central V of M -->
  <path d="M38 43 L50 51 L62 43 L50 35 Z" 
        fill="#38BDF8" />

  <!-- Central Digital Core Prism (Quantum/AI Core) -->
  <path d="M50 49 L60 55 L50 62 L40 55 Z" 
        fill="#FFFFFF" 
        box-shadow="0 0 10px #00D2FF" />
  <path d="M40 55 L50 62 L50 71 L40 64 Z" 
        fill="#00D2FF" />
  <path d="M60 55 L50 62 L50 71 L60 64 Z" 
        fill="#2563EB" />

  <!-- Lower Hex Anchor Foundation -->
  <path d="M36 74 L50 82 L64 74 L50 68 Z" 
        fill="url(#coreGrad)" 
        opacity="0.85" />

  <!-- Micro Circuit Node Accents -->
  <circle cx="50" cy="22" r="2.5" fill="#00D2FF" />
  <line x1="50" y1="24.5" x2="50" y2="35" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="1 1" />
  
  <circle cx="28" cy="74" r="2" fill="#38BDF8" />
  <circle cx="72" cy="74" r="2" fill="#38BDF8" />
</svg>
