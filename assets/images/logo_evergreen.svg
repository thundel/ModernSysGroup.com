<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" fill="none">
  <defs>
    <linearGradient id="logoShieldGradEvergreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EE0B0" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="logoCoreGradEvergreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="logoFacetGradEvergreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A291E" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7EE0B0" stop-opacity="0.25" />
    </linearGradient>
    <filter id="logoGlowEvergreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Side: Icon Crest (56x56 scaled) -->
  <g transform="translate(6, 7) scale(0.56)">
    <!-- Dark Background Capsule Backing -->
    <rect width="100" height="100" rx="20" fill="#071913" />

    <!-- Outer Cyber Hex Shield -->
    <path d="M50 8 L88 28 L88 72 L50 92 L12 72 L12 28 Z" 
          fill="url(#logoFacetGradEvergreen)" 
          stroke="url(#logoShieldGradEvergreen)" 
          stroke-width="3.5" 
          stroke-linejoin="round"
          filter="url(#logoGlowEvergreen)" />

    <!-- Left Pillar of M -->
    <path d="M22 34 L38 43 L38 72 L22 63 Z" 
          fill="url(#logoCoreGradEvergreen)" 
          opacity="0.95" />
    
    <!-- Right Pillar of M -->
    <path d="M78 34 L62 43 L62 72 L78 63 Z" 
          fill="url(#logoShieldGradEvergreen)" 
          opacity="0.95" />

    <!-- Upper Central V of M -->
    <path d="M38 43 L50 51 L62 43 L50 35 Z" 
          fill="#A7F3D0" />

    <!-- Central Digital Core Prism -->
    <path d="M50 49 L60 55 L50 62 L40 55 Z" 
          fill="#FFFFFF" />
    <path d="M40 55 L50 62 L50 71 L40 64 Z" 
        fill="#7EE0B0" />
    <path d="M60 55 L50 62 L50 71 L60 64 Z" 
        fill="#059669" />

    <!-- Lower Hex Anchor Foundation -->
    <path d="M36 74 L50 82 L64 74 L50 68 Z" 
          fill="url(#logoCoreGradEvergreen)" 
          opacity="0.85" />

    <circle cx="50" cy="22" r="2.5" fill="#7EE0B0" />
  </g>

  <!-- Right Side: Clean Typography -->
  <!-- ModernSys -->
  <text x="76" y="38" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="-0.5" 
        fill="#FFFFFF">
    ModernSys<tspan fill="#7EE0B0" class="brand-group-text">Group</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="77" y="54" 
        font-family="'JetBrains Mono', monospace" 
        font-size="8.5" 
        font-weight="600" 
        letter-spacing="2.8" 
        fill="#7BA896">
    ENTERPRISE IT CONSULTING
  </text>
</svg>
